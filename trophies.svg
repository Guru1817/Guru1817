<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" fill="none" role="img" aria-label="Trophies">
  <defs>
    <linearGradient id="tCell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b1f"/><stop offset="1" stop-color="#0d0612"/>
    </linearGradient>
    <linearGradient id="tGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76f"/><stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="shineT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="stripClip"><rect x="0" y="0" width="900" height="150" rx="14"/></clipPath>
    <style>
      .m{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
      .cell{opacity:0;animation:pop .5s ease-out forwards;transform-box:fill-box;transform-origin:center}
      @keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
    </style>
  </defs>
  <g clip-path="url(#stripClip)">
    <!-- 5 trophy cells -->
    <g class="cell" style="animation-delay:.1s" transform="translate(15 15)">
      <rect width="160" height="120" rx="12" fill="url(#tCell)" stroke="#ffd76f" stroke-opacity="0.4"/>
      <text x="80" y="46" font-size="30" text-anchor="middle">🏆</text>
      <text class="m" x="80" y="74" font-size="12" fill="#ffd76f" text-anchor="middle" font-weight="700">Commits</text>
      <text class="m" x="80" y="98" font-size="11" fill="#e9d6ff" text-anchor="middle">Rank: A</text>
    </g>
    <g class="cell" style="animation-delay:.25s" transform="translate(190 15)">
      <rect width="160" height="120" rx="12" fill="url(#tCell)" stroke="#7c5cff" stroke-opacity="0.4"/>
      <text x="80" y="46" font-size="30" text-anchor="middle">⭐</text>
      <text class="m" x="80" y="74" font-size="12" fill="#c86bff" text-anchor="middle" font-weight="700">Stars</text>
      <text class="m" x="80" y="98" font-size="11" fill="#e9d6ff" text-anchor="middle">Rank: B</text>
    </g>
    <g class="cell" style="animation-delay:.4s" transform="translate(365 15)">
      <rect width="160" height="120" rx="12" fill="url(#tCell)" stroke="#ff5fbf" stroke-opacity="0.4"/>
      <text x="80" y="46" font-size="30" text-anchor="middle">📦</text>
      <text class="m" x="80" y="74" font-size="12" fill="#ff8fd8" text-anchor="middle" font-weight="700">Repos</text>
      <text class="m" x="80" y="98" font-size="11" fill="#e9d6ff" text-anchor="middle">Rank: A</text>
    </g>
    <g class="cell" style="animation-delay:.55s" transform="translate(540 15)">
      <rect width="160" height="120" rx="12" fill="url(#tCell)" stroke="#ffd76f" stroke-opacity="0.4"/>
      <text x="80" y="46" font-size="30" text-anchor="middle">🚀</text>
      <text class="m" x="80" y="74" font-size="12" fill="#ffd76f" text-anchor="middle" font-weight="700">Shipped</text>
      <text class="m" x="80" y="98" font-size="11" fill="#e9d6ff" text-anchor="middle">Rank: S</text>
    </g>
    <g class="cell" style="animation-delay:.7s" transform="translate(715 15)">
      <rect width="160" height="120" rx="12" fill="url(#tCell)" stroke="#7c5cff" stroke-opacity="0.4"/>
      <text x="80" y="46" font-size="30" text-anchor="middle">🎓</text>
      <text class="m" x="80" y="74" font-size="12" fill="#c86bff" text-anchor="middle" font-weight="700">MCA · 8.8</text>
      <text class="m" x="80" y="98" font-size="11" fill="#e9d6ff" text-anchor="middle">Top 10%</text>
    </g>

    <!-- shine sweep across the whole strip -->
    <rect x="-300" y="0" width="180" height="150" fill="url(#shineT)" transform="skewX(-20)">
      <animate attributeName="x" values="-300;1000" dur="3.5s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
